{% extends "base.html" %}

{% block title %}STH - Dashboard Tubulação{% endblock %}

{% block content %}
<div class="dashboard-page">
    <header class="dashboard-header">
        <div>
            <h1 class="dashboard-title">Dashboard Tubulação - CONSAG U36</h1>
            <p class="dashboard-date" id="dataAtual">--/--/----</p>
        </div>

        <div class="spools-header-card">
            <strong id="spoolsTotalHeader">0</strong>
            <span>Spools Total</span>
        </div>
    </header>

    <nav class="dashboard-nav-row">
        <a href="{{ url_for('pages.ppu') }}" class="nav-tab">📋 PPU</a>
        <a href="{{ url_for('pages.dashboard') }}" class="nav-tab">📈 KPIs</a>
        <a href="{{ url_for('pages.sth') }}" class="nav-tab active">🔧 STH</a>
        <a href="{{ url_for('pages.spools') }}" class="nav-tab">🏗️ SPOOL's</a>
    </nav>

    <section class="panel">
        <div class="panel-header">
            <h2>STH</h2>
            <p class="panel-subtitle">Em desenvolvimento</p>
        </div>
        <div class="chart-area">
            <p style="opacity: 0.6;">Em desenvolvimento</p>
        </div>
    </section>
</div>

<script src="{{ url_for('static', filename='js/sth.js') }}"></script>
{% endblock %}
